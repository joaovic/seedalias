<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>i18n Test</title>
  <script src="translations.js"></script>
  <script src="i18n.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .test-box { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    .lang-flag { font-size: 20px; }
  </style>
</head>
<body>
  <h1>i18n Test Page</h1>
  
  <div class="test-box">
    <h2>Language Switcher</h2>
    <div class="lang-dropdown" id="lang-dropdown">
      <button class="lang-toggle" id="lang-toggle">
        <span class="lang-flag">🇺🇸</span>
        <span>▼</span>
      </button>
      <div class="lang-menu" id="lang-menu" style="display: none; border: 1px solid #ccc; padding: 10px;">
        <button class="lang-option" data-lang="en-US">🇺🇸 English</button>
        <br>
        <button class="lang-option" data-lang="pt-BR">🇧🇷 Português</button>
      </div>
    </div>
  </div>
  
  <div class="test-box">
    <h2>Translations</h2>
    <p data-i18n="app.title">SEED ALIAS</p>
    <p data-i18n="app.tagline">Cryptographic Seed Protection</p>
    <p data-i18n="encrypt.button">Encrypt</p>
    <p data-i18n="decrypt.button">Decrypt</p>
  </div>
  
  <div class="test-box">
    <h2>Status Badge Test</h2>
    <span class="status-badge" data-i18n="encrypt.statusWaiting">
      <i>●</i>
      <span>Waiting</span>
    </span>
  </div>
  
  <div class="test-box">
    <h2>Debug Info</h2>
    <div id="debug-info"></div>
  </div>

  <script>
    // Debug info
    setTimeout(() => {
      const debug = document.getElementById('debug-info');
      const info = {
        'window.translations exists': typeof window.translations !== 'undefined',
        'window.i18n exists': typeof window.i18n !== 'undefined',
        'current language': window.i18n ? window.i18n.getCurrentLanguage() : 'N/A',
        'sample translation': window.i18n ? window.i18n.getText('app.title') : 'N/A'
      };
      debug.innerHTML = '<pre>' + JSON.stringify(info, null, 2) + '</pre>';
    }, 100);
  </script>
</body>
</html>
